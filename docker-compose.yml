# EventPulse backend infrastructure (matches backend/.env dev defaults)
#   docker compose up -d   -> Postgres on :5433, Redis on :6380
#   npm run start:dev       -> backend on :3000
services:
  postgres:
    image: postgres:16-alpine
    container_name: eventpulse-postgres
    environment:
      POSTGRES_USER: eventpulse
      POSTGRES_PASSWORD: eventpulse_dev
      POSTGRES_DB: eventpulse
    ports:
      - "5433:5432"
    volumes:
      - eventpulse-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eventpulse-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eventpulse-pg: {}