# Docker infrastructure for EventPulse V2.1
version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: eventpulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventpulse_dev}
      POSTGRES_DB: ${POSTGRES_DB:-eventpulse}
    ports:
      - "5433:5432"
    volumes:
      - eventpulse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: eventpulse-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - eventpulse-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: Kafka for the EVENT_BUS_PROVIDER=kafka path.
  kafka:
    image: bitnami/kafka:3.6
    container_name: eventpulse-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    profiles:
      - kafka
    depends_on:
      - postgres
      - redis

volumes:
  eventpulse-pgdata:
  eventpulse-redisdata:
